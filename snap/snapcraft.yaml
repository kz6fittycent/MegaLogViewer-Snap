name: megalogviewer
adopt-info: megalogviewer
title: MegaLogViewer
summary: UNOFFICIAL - MegaLogViewer MegaSquirt Edition - data log viewer
description: |
  MegaLogViewer MegaSquirt Edition, the data log viewer and analysis tool
  from EFI Analytics for MegaSquirt and TunerStudio data logs.

  After installing, run the following command:

  sudo snap connect megalogviewer:removable-media

  This is NOT an officially supported snap from EFI Analytics.

base: core24
grade: stable
confinement: strict
compression: lzo
icon: snap/gui/megalogviewer.png
contact: https://github.com/kz6fittycent/MegaLogViewer-Snap
# "Proprietary" (capitalised) is what snap pack accepts; snapcraft suggests
# lowercase "proprietary", but snapd rejects it as an unknown license.
license: Proprietary
website: https://www.efianalytics.com/MegaLogViewer/
issues: https://github.com/kz6fittycent/MegaLogViewer-Snap/issues
source-code: https://github.com/kz6fittycent/MegaLogViewer-Snap

platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]

apps:
  megalogviewer:
    extensions:
      - gnome
    command: launch
    plugs:
      - home
      - removable-media
      - browser-support
      - x11
      - desktop
      - desktop-legacy
      - network
    environment:
      JAVA_HOME: $SNAP/usr/lib/jvm/java-17-openjdk-amd64
      JRE_HOME: $SNAP/usr/lib/jvm/java-17-openjdk-amd64/jre

parts:
  megalogviewer:
    plugin: nil
    # Upstream has no stable "latest" URL, so the newest Linux tarball is
    # discovered from the download page (see snap/local/megalogviewer-latest.sh).
    override-pull: |
      set -eu
      LATEST=$(sh "$CRAFT_PROJECT_DIR/snap/local/megalogviewer-latest.sh")
      VERSION=${LATEST%% *}
      URL=${LATEST#* }
      echo "Fetching MegaLogViewer $VERSION from $URL"
      rm -rf MegaLogViewer megalogviewer.tar.gz
      curl -fSL --retry 5 --retry-delay 5 -o megalogviewer.tar.gz "$URL"
      gzip -t megalogviewer.tar.gz
      tar -xzf megalogviewer.tar.gz
      rm megalogviewer.tar.gz
      test -f MegaLogViewer/MegaLogViewer.jar
      craftctl set version="$VERSION"

    override-build: |
      mkdir -p "$CRAFT_PART_INSTALL/bin"
      cp -r "$CRAFT_PART_SRC/MegaLogViewer" "$CRAFT_PART_INSTALL/bin/"

    build-packages:
      - ca-certificates
      - curl
      - gzip
      - tar

    # Same Java 17 runtime set as the TunerStudio snap (same vendor and
    # toolkit), which is known to work on core24.
    stage-packages:
      - openjdk-17-jdk
      - openjdk-17-jre
      - librxtx-java
      - fontconfig
      - fontconfig-config
      - libfontconfig1
      - x11-xserver-utils
      - x11-utils
      - libgtk-3-dev
      - ca-certificates-java
      - ca-certificates

    stage:
    - -usr/lib/jvm/java-17-openjdk-*/lib/security/cacerts
    - -usr/lib/jvm/java-17-openjdk-*/lib/security/blocked.certs
    - -usr/lib/jvm/java-17-openjdk-amd64/jre/lib/security/cacerts

  launcher:
    plugin: dump
    source: scripts

  cleanup:
    after:
      - megalogviewer
      - launcher
    plugin: nil
    build-snaps:
      - core24
